<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServiceTool | Advisor Lookup</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>ServiceTool <span>Quick Advisor Lookup</span></h1>
        </header>

        <section class="card input-card">
            <div class="form-grid">
                <div class="form-group">
                    <label for="vin">Vehicle VIN (17 digits)</label>
                    <input type="text" id="vin" placeholder="e.g. ZARFAEEN..." maxlength="17" autofocus autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="mileage">Current Mileage</label>
                    <input type="number" id="mileage" placeholder="e.g. 29500" min="0">
                </div>

                <div class="form-group">
                    <label for="inServiceDate">In-Service Date / Year</label>
                    <input type="text" id="inServiceDate" placeholder="e.g. Aug 20, 2021, 08/20">
                </div>

                <div class="form-group">
                    <label for="customerName">Customer Name (Optional)</label>
                    <input type="text" id="customerName" placeholder="e.g. John Smith">
                </div>
            </div>

            <div class="button-row">
                <button id="decodeButton" class="btn btn-primary">Lookup Vehicle</button>
                <button id="clearButton" class="btn btn-secondary">Clear</button>
            </div>
        </section>

        <main id="result" class="results-container"></main>
    </div>

    <!-- Advisor Story & Pitch Modal -->
    <div id="storyModal" class="modal-backdrop" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <div>
                    <h3 id="modalVehicleTitle">Vehicle Service Pitch</h3>
                    <p class="modal-subtitle">Tailored value propositions and upcoming appointment SMS</p>
                </div>
                <button id="closeModalBtn" class="btn-close">&times;</button>
            </div>

            <div class="modal-body">
                <!-- Section A: Verbal Word Track -->
                <div class="story-section">
                    <div class="section-label">
                        <span>📞 Phone Word-Track (Spoken Script)</span>
                        <button id="copyWordTrackBtn" class="btn-mini">📋 Copy Script</button>
                    </div>
                    <div id="wordTrackText" class="story-box wordtrack-box"></div>
                </div>

                <!-- Section B: Customer SMS -->
                <div class="story-section">
                    <div class="section-label">
                        <span>📱 Customer Text / SMS (Upcoming Appointment)</span>
                        <button id="copySmsBtn" class="btn-mini btn-mini-primary">📋 Copy SMS</button>
                    </div>
                    <textarea id="smsText" class="story-box sms-box" rows="8"></textarea>
                </div>
            </div>
        </div>
    </div>

    <script src="./script.js" defer></script>
</body>
</html>
