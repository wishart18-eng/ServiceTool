<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServiceTool VIN Decoder</title>
    <link rel="stylesheet" href="./style.css">
</head>
    <meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ServiceTool">
<body>

    <h1>ServiceTool VIN Decoder</h1>

    <div class="input-row">
        <input type="text" id="vin" placeholder="Enter VIN" maxlength="17" autofocus autocomplete="off">
        <input type="number" id="mileage" placeholder="Current Mileage" min="0">
        <input type="text" id="inServiceDate" placeholder="In-Service (e.g. Aug 20, 2021)">
        <input type="text" id="customerName" placeholder="Customer Name (Optional)">
        <button id="decodeButton">Decode</button>
        <button id="clearButton">Clear</button>
    </div>

    <div id="result"></div>

    <!-- Modal Popup for Word Track & SMS -->
    <div id="storyModal" class="modal-backdrop" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalVehicleTitle">Vehicle Service Pitch</h3>
                <button id="closeModalBtn" class="btn-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="story-section">
                    <div class="story-label-row">
                        <strong>📞 Phone Word-Track (Spoken Script)</strong>
                        <button id="copyWordTrackBtn">Copy Script</button>
                    </div>
                    <div id="wordTrackText" class="story-box wordtrack-box"></div>
                </div>

                <div class="story-section">
                    <div class="story-label-row">
                        <strong>📱 Customer Text / SMS (Upcoming Appointment)</strong>
                        <button id="copySmsBtn">Copy SMS</button>
                    </div>
                    <textarea id="smsText" class="story-box sms-box" rows="7"></textarea>
                </div>
            </div>
        </div>
    </div>

    <script src="./script.js" defer></script>
</body>
</html>
